name: Publish npm
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - name: Build and accept the exact distribution
        run: |
          mkdir -p outputs
          node scripts/accept-npm.mjs > outputs/npm-release-acceptance.json
      - name: Publish on version tags; manual runs are dry-run only
        env:
          RELEASE_PUBLISH: ${{ github.event_name == 'push' }}
        run: |
          if [ "$RELEASE_PUBLISH" = true ]; then
            node scripts/publish-npm.mjs --report outputs/npm-release-acceptance.json --publish
          else
            node scripts/publish-npm.mjs --report outputs/npm-release-acceptance.json
          fi
      - name: Reinstall and accept the registry version
        if: github.event_name == 'push'
        run: pnpm check:npm --registry outputs/npm-release-acceptance.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: npm-release-${{ github.sha }}
          overwrite: true
          if-no-files-found: warn
          path: |
            outputs/npm-release-acceptance.json
            outputs/npm-release-receipt.json
            outputs/npm-*/*.tgz
            outputs/npm-*/pack-report.json
            outputs/npm-*/acceptance.json
            outputs/npm-registry-*/registry-metadata.json
