name: Bug report
description: Report a reproducible failure using synthetic inputs.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities use SECURITY.md. Never attach credentials or private Skill content."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node/pnpm versions, commit, host and command.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal fixture and commands; include actual versus expected behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Error codes and relevant output without sensitive paths or data.
