# skill-hub default agent path mapping (template)
# Copy/merge into ~/.skill-hub/config.yaml via `skill-hub init`

version: 1

canonical_dir: ~/.skill-hub/skills
index_dir: ~/.skill-hub/index
backup_dir: ~/.skill-hub/backups

agents:
  - id: workbuddy
    skills_dir: ~/.workbuddy/skills
    enabled: true
  - id: claude-code
    skills_dir: ~/.claude/skills
    enabled: true
  - id: codex
    skills_dir: ~/.codex/skills
    enabled: true
  - id: agents
    skills_dir: ~/.agents/skills
    enabled: true
  - id: cursor
    skills_dir: ~/.cursor/skills
    enabled: true

# 可选的 Skill 盘点/导入来源；只扫描其中包含 SKILL.md 的目录。
# sources 不等于同步目标，project/workspace source 不会默认同步到全局 Agent。
# inventory 另含主流 Agent 内置只读来源；同 id source 可覆盖路径/停用。
# 例：deepseek-harness -> ~/.dsh/skills；完整列表见 docs/ops/ENVIRONMENT.md。
# 内置来源须 ingest --sources <id> 显式导入，不加入同步目标。
sources: []

router:
  top_k: 5
  engine: bm25

sync:
  mode: symlink
  conflict: report
  require_backup: true

privacy:
  telemetry: false
